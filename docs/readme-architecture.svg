<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Meeting Orchestrator workflow</title><desc id="desc">A master agent analyses notes, plans actions, routes work to specialised Jira and Calendar modules, then reports confidence and execution results.</desc><rect width="1200" height="400" rx="18" fill="#F3F0E8"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#5B7863">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2F342D">Meeting Orchestrator</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#73796F">Meeting notes into Jira tasks and calendar events</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D9DCCF"/><path d="M 300 237 L 330 237" stroke="#73796F" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#73796F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#73796F" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#73796F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#73796F" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#73796F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFDF8" stroke="#D9DCCF" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#5B7863"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5B7863">01 / MEETING NOTES</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2F342D">Text or transcript</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#73796F">Provide the discussion and decisions.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFDF8" stroke="#D9DCCF" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#B18446"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#B18446">02 / MASTER AGENT</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2F342D">Extract and plan</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#73796F">Identify tasks, dates, owners, and confidence.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFDF8" stroke="#D9DCCF" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#5D7890"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5D7890">03 / SPECIALISTS</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2F342D">Jira + Calendar</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#73796F">Prepare actionable tickets and events.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFDF8" stroke="#D9DCCF" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#5B7863"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5B7863">04 / RESULTS</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2F342D">Review and execute</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#73796F">Show proposed and completed actions.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#5B7863">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#73796F">Verify extracted owners, deadlines, and confidence before enabling external write operations.</text></svg>